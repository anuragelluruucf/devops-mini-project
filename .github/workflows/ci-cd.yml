name: ci-cd
on:
  push: { branches: [main] }
  pull_request:

env:
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ml-inference-demo/app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  terraform-check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate

  build-deploy:
    if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    needs: [test, terraform-check]
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
      - run: |
          docker build -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:${{ github.sha }}
      - uses: hashicorp/setup-terraform@v3
      - working-directory: terraform
        run: |
          terraform init   # configure a GCS backend for real use
          terraform apply -auto-approve \
            -var project_id=${{ vars.GCP_PROJECT_ID }} \
            -var image=$IMAGE:${{ github.sha }}
